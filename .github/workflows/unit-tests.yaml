name: Unit Tests
on:
  push:
    branches: ["*"] # glob pattern to allow slash /
  pull_request:
    branches: [ main ]
    types: [opened, synchronize]

env:
  CI: true # emulator to use -no-window

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        api-level: [29] # [21, 23, 29]
    steps:

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: bun install
        run: bun install

      - name: Build packages
        run: bun run build:packages

      - name: Install expo dependencies
        run: bun expo install --fix

      - name: Add Android SDK emulator to PATH
        run: echo "/usr/local/lib/android/sdk/emulator/" >> $GITHUB_PATH

      - name: Run tests with emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Running CI-optimized unit tests..."
            bun test:unit:ci
