name: Unit Tests
on:
  push:
    branches: ["*"] # glob pattern to allow slash /
  pull_request:
    branches: [ main ]
    types: [opened, synchronize]

env:
  CI: true # emulator to use -no-window

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        api-level: [29] # [21, 23, 29]
    steps:

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: bun install
        run: bun install

      - name: Build packages
        run: bun run build:packages

      - name: Install expo dependencies
        run: bun expo install --fix

      - name: Add Android SDK emulator to PATH
        run: echo "/usr/local/lib/android/sdk/emulator/" >> $GITHUB_PATH

      - name: Run tests with emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Starting React Native app..."
            bun android &
            APP_PID=$!

            # Wait for app to be installed and bundled
            echo "Waiting for app to bundle and load..."
            timeout=300  # 5 minutes
            counter=0
            while [ $counter -lt $timeout ]; do
              if adb logcat -d | grep -q "Android Bundled"; then
                echo "App has been bundled successfully"
                break
              fi
              sleep 5
              counter=$((counter + 5))
            done

            if [ $counter -ge $timeout ]; then
              echo "Timeout waiting for app to bundle"
              kill $APP_PID 2>/dev/null || true
              exit 1
            fi

            # Give the app additional time to fully initialize
            sleep 15

            echo "Checking for debugging URL availability..."
            timeout=180  # 3 minutes
            counter=0

            while [ $counter -lt $timeout ]; do
              # Check if Chrome DevTools debugging endpoint is available
              if curl -s "http://localhost:8081/json" | grep -q "webSocketDebuggerUrl"; then
                echo "Debugging URL is available!"
                curl -s "http://localhost:8081/json" | head -5
                break
              fi
              echo "Waiting for debugging endpoint... ($counter/$timeout)"
              sleep 5
              counter=$((counter + 5))
            done

            if [ $counter -ge $timeout ]; then
              echo "Timeout waiting for debugging endpoint"
              adb logcat -d | tail -50
              kill $APP_PID 2>/dev/null || true
              exit 1
            fi

            echo "Running unit tests..."
            bun test:unit
            test_result=$?

            # Clean up the React Native app process
            kill $APP_PID 2>/dev/null || true

            # Exit with the test result
            exit $test_result
